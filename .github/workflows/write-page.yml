name: Write Page

# Every Monday: write the next guide from content/queue.json, illustrate its
# sections, make its video, rebuild the site, and open a PR to review.
# auto-merge.yml merges it after 72 hours.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: write-page
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Refuse to run while a previous auto-page PR is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh pr list --label auto-page --state open --json number --jq '[.[].number | "#\(.)"] | join(", ")')
          if [ -n "$OPEN" ]; then
            echo "::error::Auto-page PR(s) $OPEN still open. Merge or close them, then re-run this workflow."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install the card renderer
        run: npm ci

      - name: Write the next guide
        run: node scripts/write-page.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # A failed image or video doesn't block the guide; Make Videos retries
      # it after this PR merges.
      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Illustrate the new guide's sections
        continue-on-error: true
        run: node scripts/make-section-images.js --limit 1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Make the new guide's video
        continue-on-error: true
        run: node scripts/make-videos.js --limit 1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Build the site
        run: node scripts/build.js

      - name: Commit changes and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create auto-page --color BFD4F2 --description "Opened by the Write Page workflow" || true

          BRANCH="page/$(date +'%Y-%m-%d')-${{ github.run_number }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b "$BRANCH"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit; nothing to open a PR for."
            exit 0
          fi

          TITLE=$(git diff --cached --name-only -- content/pages | head -1 | xargs -I{} node -p "require('./{}').title")
          git commit -m "New guide: $TITLE"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "New guide: $TITLE" \
            --label auto-page \
            --body "Written by the Write Page workflow from the next topic in content/queue.json. The page passed the privacy, HTML, length, link, and similarity checks in scripts/write-page.js. The Auto-merge Guides workflow publishes it after 72 hours; add the hold label to stop that." \
            --base main \
            --head "$BRANCH"
